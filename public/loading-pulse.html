<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zero Zero</title>
  <style>
    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .pulse-ring {
      width: 80px;
      height: 80px;
      border: 8px solid #000AFF; /* --color-blue */
      border-radius: 9999px;
      animation: mechanical-pulse 1.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    @keyframes mechanical-pulse {
      0%   { transform: scale(0.8); opacity: 1; border-width: 20px; }
      100% { transform: scale(2.5); opacity: 0; border-width: 2px; }
    }
  </style>
</head>
<body>
  <div class="pulse-ring" aria-hidden="true"></div>
</body>
</html>

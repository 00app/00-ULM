# Satisfies Vercel Deployment Checks when project uses GitHub Actions (job names must be Lint + Typecheck).
# Vercel → Settings → Deployment Checks → GitHub Actions → require these jobs (not broken native Next checks).
name: Vercel production gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: vercel-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint:ci

  Typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck:ci
      - run: npm run test:mechanical-truth
